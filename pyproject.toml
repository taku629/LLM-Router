[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "llmrouter"
version = "0.1.0"
description = "Cost-aware LLM router with OpenAI-compatible client"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "openai>=1.0.0",
]

[project.optional-dependencies]
dashboard = ["fastapi>=0.110", "uvicorn>=0.30"]
dev = ["pytest>=8.0"]

[project.scripts]
llmrouter = "llmrouter.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
